name: Publish create-app-dock

on:
  push:
    tags:
      - 'create-app-dock-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Enable the pinned pnpm release
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the template and CLI
        run: pnpm run test:scripts

      - name: Verify the tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./packages/create-app-dock/package.json').version")
          test "$RELEASE_TAG" = "create-app-dock-v$package_version"

      - name: Publish through npm Trusted Publishing
        working-directory: packages/create-app-dock
        run: npm publish --access public
